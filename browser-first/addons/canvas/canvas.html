<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http://* https://*;">
  <title>System Map — ResonantOS</title>
  <link rel="stylesheet" href="canvas.css">
</head>
<body>

<div class="app-shell">

  <header class="app-header">
    <div class="header-logo">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <circle cx="13" cy="13" r="11" stroke="#14F195" stroke-width="1.4" fill="none"/>
        <circle cx="13" cy="6"  r="2.5" fill="#14F195"/>
        <circle cx="20" cy="17" r="2.5" fill="#9945FF"/>
        <circle cx="6"  cy="17" r="2.5" fill="#14F195"/>
        <line x1="13" y1="8.5" x2="13" y2="11"  stroke="#14F195" stroke-width="1"/>
        <line x1="13" y1="13"  x2="18.2" y2="15.5" stroke="#9945FF" stroke-width="1"/>
        <line x1="13" y1="13"  x2="7.8" y2="15.5" stroke="#14F195" stroke-width="1"/>
        <circle cx="13" cy="13" r="2" fill="none" stroke="#9945FF" stroke-width="1"/>
      </svg>
      <div>
        <div class="header-title">System Map</div>
        <div class="header-subtitle">Live Topology · ResonantOS</div>
      </div>
    </div>
    <div class="header-actions">
      <span id="bridge-status" class="bridge-pill">Connecting...</span>
      <button id="btn-refresh" class="btn-secondary">↻ Refresh</button>
      <button id="btn-reset-view" class="btn-secondary">Reset View</button>
    </div>
  </header>

  <main class="canvas-main">
    <div id="canvas-error" class="canvas-error" style="display:none"></div>
    <div id="canvas-empty" class="canvas-empty" style="display:none">
      <div class="empty-icon">◉</div>
      <h3>No nodes configured</h3>
      <p>Click <strong>+ Add Node</strong> above to add your first fleet node.</p>
    </div>
    <canvas id="topology-canvas"></canvas>
    <div id="node-tooltip" class="node-tooltip" style="display:none"></div>
  </main>

  <div id="legend" class="legend">
    <span class="legend-item"><span class="dot online"></span>Online</span>
    <span class="legend-item"><span class="dot offline"></span>Offline</span>
    <span class="legend-item"><span class="dot service"></span>Service</span>
  </div>

  <footer class="app-footer">
    <span style="color:var(--text-dim)">addon.canvas · ResonantOS</span>
    <span class="footer-pill">Data in Chrome Storage · Ollama probes direct</span>
  </footer>

</div>

<script type="module" src="canvas.js"></script>
</body>
</html>
